[project]
name = "modus"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fabric",
    "httpx>=0.28.1",
    "pam>=0.2.0",
    "psutil>=7.2.2",
    "pywayland>=0.4.18",
    "six>=1.17.0",
    "tomlkit>=0.15.0",
]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "ruff>=0.15.2",
]

[project.scripts]
start = "main:main"
lock = "lock:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/utils", "src/window", "src/services", "src/globalmenu", "src/main.py"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
"src/window/switcher/main.py" = ["E402"]

[tool.uv.sources]
fabric = { git = "https://github.com/Fabric-Development/fabric.git" }
